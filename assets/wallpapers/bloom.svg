<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!--
    Windows 11 Bloom-inspired desktop wallpaper, drawn for this portfolio.
    A layered bloom on the right (blue -> violet -> coral -> pink), a soft
    peach flower lower left, on a pale blue-grey sky.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3e2f0" />
      <stop offset="1" stop-color="#aec7df" />
    </linearGradient>

    <linearGradient id="r1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3566ea" />
      <stop offset="1" stop-color="#1433a3" />
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5476f2" />
      <stop offset="1" stop-color="#2a3cbd" />
    </linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8462ea" />
      <stop offset="1" stop-color="#4a31b5" />
    </linearGradient>
    <linearGradient id="r4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bd5fd9" />
      <stop offset="1" stop-color="#7a33ad" />
    </linearGradient>
    <linearGradient id="r5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f07590" />
      <stop offset="1" stop-color="#c13f6c" />
    </linearGradient>
    <linearGradient id="r6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbc4d2" />
      <stop offset="1" stop-color="#e98aa6" />
    </linearGradient>

    <linearGradient id="l1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbd9c8" />
      <stop offset="1" stop-color="#f0a487" />
    </linearGradient>
    <linearGradient id="l2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9c6d3" />
      <stop offset="1" stop-color="#e98aa9" />
    </linearGradient>
    <linearGradient id="l3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0e8" />
      <stop offset="1" stop-color="#f7c3ad" />
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="46" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)" />

  <!-- shadows -->
  <ellipse cx="1520" cy="690" rx="560" ry="430" fill="#2f4675" opacity="0.32" filter="url(#soft)" />
  <ellipse cx="320" cy="950" rx="320" ry="210" fill="#8a5a6f" opacity="0.22" filter="url(#soft)" />

  <!-- right bloom: each layer is offset left, so its right edge shows as a band -->
  <g transform="translate(1500 590) rotate(-18)">
    <ellipse cx="70" cy="0" rx="530" ry="440" fill="url(#r1)" />
    <ellipse cx="22" cy="12" rx="478" ry="396" fill="url(#r2)" />
    <ellipse cx="-24" cy="24" rx="424" ry="350" fill="url(#r3)" />
    <ellipse cx="-68" cy="36" rx="370" ry="304" fill="url(#r4)" />
    <ellipse cx="-110" cy="48" rx="314" ry="256" fill="url(#r5)" />
    <ellipse cx="-150" cy="60" rx="254" ry="206" fill="url(#r6)" />
  </g>

  <!-- left flower -->
  <g transform="translate(300 930) scale(0.8)">
    <g>
      <ellipse cx="0" cy="-175" rx="150" ry="235" fill="url(#l1)" />
      <ellipse cx="0" cy="-175" rx="150" ry="235" fill="url(#l2)" transform="rotate(72)" />
      <ellipse cx="0" cy="-175" rx="150" ry="235" fill="url(#l1)" transform="rotate(144)" />
      <ellipse cx="0" cy="-175" rx="150" ry="235" fill="url(#l2)" transform="rotate(216)" />
      <ellipse cx="0" cy="-175" rx="150" ry="235" fill="url(#l1)" transform="rotate(288)" />
    </g>
    <g transform="rotate(36)">
      <ellipse cx="0" cy="-118" rx="104" ry="166" fill="url(#l3)" />
      <ellipse cx="0" cy="-118" rx="104" ry="166" fill="url(#l3)" transform="rotate(72)" />
      <ellipse cx="0" cy="-118" rx="104" ry="166" fill="url(#l3)" transform="rotate(144)" />
      <ellipse cx="0" cy="-118" rx="104" ry="166" fill="url(#l3)" transform="rotate(216)" />
      <ellipse cx="0" cy="-118" rx="104" ry="166" fill="url(#l3)" transform="rotate(288)" />
    </g>
    <circle r="58" fill="#f2a084" />
  </g>
</svg>
