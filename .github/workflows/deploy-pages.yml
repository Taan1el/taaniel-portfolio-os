name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  # Rebuilds with a fresh TV guide. The free listings only look five or six hours ahead.
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A scheduled run only refreshes the TV guide. This commit's tests ran when it was pushed.
      - name: Run tests
        if: github.event_name != 'schedule'
        run: npm test

      - name: Fetch the TV guide
        continue-on-error: true
        run: node scripts/build-tv-guide.mjs

      - name: Build GitHub Pages bundle
        run: npm run build:gh

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
